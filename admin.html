<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>MoouRBX Admin Panel</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#0b0b0f;
color:white;
padding:20px;
}

.box{
background:#13131a;
border:1px solid #26263a;
padding:20px;
border-radius:18px;
box-shadow:0 0 20px rgba(111,0,255,0.25);
}

.title{
font-size:30px;
font-weight:bold;
color:#9d5cff;
margin-bottom:10px;
}

.subtitle{
color:#8d8d99;
margin-bottom:20px;
}

button{
width:100%;
padding:14px;
margin-top:12px;
border:none;
border-radius:12px;
background:#7d4dff;
color:white;
font-weight:bold;
font-size:15px;
cursor:pointer;
transition:0.2s;
}

button:hover{
opacity:0.9;
}

.status{
margin-top:20px;
color:#8d8d99;
font-size:14px;
}

.denied{
color:red;
font-size:28px;
font-weight:bold;
padding:30px;
text-align:center;
}

.login{
color:white;
font-size:28px;
font-weight:bold;
padding:30px;
text-align:center;
}

</style>

</head>
<body>

<div class="box"
id="adminPanel">

<div class="title">
MoouRBX Admin Panel
</div>

<div class="subtitle">
Moderator Controls
</div>

<button onclick="alert('Delete system coming soon')">
Delete Script
</button>

<button onclick="alert('Ban system coming soon')">
Ban User
</button>

<button onclick="alert('Verify system coming soon')">
Verify User
</button>

<button onclick="alert('Reports system coming soon')">
View Reports
</button>

<button onclick="logout()">
Logout
</button>

<div class="status"
id="status">
Checking permissions...
</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

const firebaseConfig = {
apiKey: "AIzaSyB8lCF0DgtTG7sSL4WrlidiFDYWajdcJ8E",
authDomain: "moourbx.firebaseapp.com",
databaseURL: "https://moourbx-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId: "moourbx",
storageBucket: "moourbx.firebasestorage.app",
messagingSenderId: "798297032764",
appId: "1:798297032764:web:3f5902c25f88f6f3455b39"
};

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const adminEmails = [

"kornc2020@gmail.com",
"kornc2008@gmail.com"

];

window.logout = async function(){

await signOut(auth);

location.reload();

}

onAuthStateChanged(auth,(user)=>{

const panel =
document.getElementById("adminPanel");

const status =
document.getElementById("status");

if(!user){

document.body.innerHTML = `
<div class="login">
Login required.
</div>
`;

return;

}

if(!adminEmails.includes(user.email)){

document.body.innerHTML = `
<div class="denied">
Access denied.
</div>
`;

return;

}

status.innerHTML = `
Logged in as:
<br><br>
${user.email}
`;

console.log("Admin verified.");

});

</script>

</body>
</html>
