<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>MoouRBX Admin Panel</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#0b0b0f;
color:white;
padding:20px;
}

.panel{
background:#13131a;
border:1px solid #26263a;
border-radius:18px;
padding:20px;
box-shadow:0 0 20px rgba(111,0,255,0.25);
}

.title{
font-size:32px;
font-weight:bold;
color:#9d5cff;
margin-bottom:8px;
}

.subtitle{
color:#8d8d99;
margin-bottom:20px;
}

.userBox{
background:#1b1b26;
padding:14px;
border-radius:14px;
margin-bottom:20px;
}

.scriptCard{
background:#1b1b26;
border:1px solid #2c2c44;
border-radius:16px;
padding:16px;
margin-top:15px;
}

.scriptTitle{
font-size:22px;
font-weight:bold;
color:#b78cff;
}

.scriptGame{
margin-top:5px;
color:#8d8d99;
}

.buttons{
display:flex;
gap:10px;
margin-top:15px;
}

button{
flex:1;
padding:12px;
border:none;
border-radius:12px;
background:#7d4dff;
color:white;
font-weight:bold;
cursor:pointer;
}

.deleteBtn{
background:#ff3d5a;
}

.logoutBtn{
margin-top:20px;
width:100%;
}

.denied,
.login{
font-size:28px;
font-weight:bold;
text-align:center;
padding:40px;
}

.denied{
color:red;
}

</style>

</head>
<body>

<div class="panel"
id="panel">

<div class="title">
MoouRBX Admin
</div>

<div class="subtitle">
Admin Control Panel
</div>

<div class="userBox"
id="userBox">
Checking admin permissions...
</div>

<div id="scriptsContainer">

</div>

<button class="logoutBtn"
onclick="logout()">
Logout
</button>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
getDatabase,
ref,
onValue,
remove
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

import {
getAuth,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

const firebaseConfig = {
apiKey: "AIzaSyB8lCF0DgtTG7sSL4WrlidiFDYWajdcJ8E",
authDomain: "moourbx.firebaseapp.com",
databaseURL: "https://moourbx-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId: "moourbx",
storageBucket: "moourbx.firebasestorage.app",
messagingSenderId: "798297032764",
appId: "1:798297032764:web:3f5902c25f88f6f3455b39"
};

const app =
initializeApp(firebaseConfig);

const db =
getDatabase(app);

const auth =
getAuth(app);

const adminEmails = [

"kornc2008@gmail.com"

];

window.logout = async function(){

await signOut(auth);

location.reload();

}

onAuthStateChanged(auth,(user)=>{

if(!user){

document.body.innerHTML = `
<div class="login">
Login required.
</div>
`;

return;

}

if(!adminEmails.includes(user.email)){

document.body.innerHTML = `
<div class="denied">
Access denied.
</div>
`;

return;

}

document
.getElementById("userBox")
.innerHTML = `
Logged in as:
<br><br>
${user.email}
`;

loadScripts();

});

function loadScripts(){

const scriptsRef =
ref(db,"scripts");

onValue(scriptsRef,(snapshot)=>{

const container =
document.getElementById("scriptsContainer");

container.innerHTML = "";

const data =
snapshot.val();

if(!data){

container.innerHTML = `
<div class="scriptCard">
No scripts uploaded.
</div>
`;

return;

}

Object.entries(data)
.reverse()
.forEach(([key,script])=>{

const card =
document.createElement("div");

card.className = "scriptCard";

card.innerHTML = `

<div class="scriptTitle">
${script.title}
</div>

<div class="scriptGame">
Game: ${script.game}
</div>

<div class="buttons">

<button onclick='copyScript(${JSON.stringify(script.script)})'>
Copy
</button>

<button class="deleteBtn"
onclick="deleteScript('${key}')">
Delete
</button>

</div>

`;

container.appendChild(card);

});

});

}

window.copyScript = function(script){

navigator.clipboard.writeText(script);

alert("Script copied.");

}

window.deleteScript = async function(key){

const confirmDelete =
confirm("Delete this script?");

if(!confirmDelete) return;

await remove(
ref(db,"scripts/" + key)
);

alert("Script deleted.");

}

</script>

</body>
</html>
