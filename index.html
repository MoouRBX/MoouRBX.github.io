<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>MoouRBX</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial;
    }

    body{
      background:#0b0b0f;
      color:white;
      padding:20px;
    }

    .topbar{
      background:#13131a;
      border:1px solid #26263a;
      padding:15px;
      border-radius:16px;
      margin-bottom:20px;
      box-shadow:0 0 20px rgba(111,0,255,0.25);
    }

    .logo{
      font-size:28px;
      font-weight:bold;
      color:#9d5cff;
    }

    .subtitle{
      color:#8d8d99;
      margin-top:5px;
    }

    .search{
      width:100%;
      margin-top:15px;
      padding:12px;
      border:none;
      outline:none;
      border-radius:12px;
      background:#1b1b26;
      color:white;
      font-size:15px;
    }

    .scripts{
      display:flex;
      flex-direction:column;
      gap:15px;
    }

    .empty{
      background:#13131a;
      border:1px solid #26263a;
      border-radius:18px;
      padding:30px;
      text-align:center;
      color:#8f8fa3;
    }

    .footer{
      margin-top:30px;
      text-align:center;
      color:#6f6f80;
      font-size:13px;
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="logo">MoouRBX</div>

    <div class="subtitle">
      Roblox Script Hub
    </div>

    <input
      type="text"
      class="search"
      placeholder="Search scripts..."
    >
  </div>

  <div class="scripts">

    <div class="empty">
      No scripts uploaded yet.
    </div>

  </div>

  <div class="footer">
    MoouRBX © 2026
  </div>

</body>
</html>
