<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScriptsRBLX</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#0b0b0f;
color:white;
padding:20px;
}

.topbar{
background:#13131a;
border:1px solid #26263a;
padding:15px;
border-radius:16px;
margin-bottom:20px;
box-shadow:0 0 20px rgba(111,0,255,0.25);
}

.logo{
font-size:30px;
font-weight:bold;
color:#9d5cff;
}

.subtitle{
margin-top:5px;
color:#8d8d99;
}

.search{
width:100%;
margin-top:15px;
padding:12px;
border:none;
outline:none;
border-radius:12px;
background:#1b1b26;
color:white;
font-size:15px;
}

.topButtons{
display:flex;
gap:10px;
margin-top:15px;
flex-wrap:wrap;
}

.topButtons button{
flex:1;
padding:14px;
border:none;
border-radius:14px;
background:#7d4dff;
color:white;
font-weight:bold;
cursor:pointer;
}

.authBox,
.uploadBox{
display:none;
background:#13131a;
border:1px solid #26263a;
border-radius:18px;
padding:20px;
margin-bottom:20px;
}

.authBox input,
.uploadBox input,
.uploadBox textarea,
.uploadBox select{
width:100%;
margin-top:12px;
padding:12px;
border:none;
border-radius:12px;
background:#1b1b26;
color:white;
}

.submitBtn{
width:100%;
margin-top:15px;
padding:14px;
border:none;
border-radius:14px;
background:#7d4dff;
color:white;
font-weight:bold;
cursor:pointer;
}

.userBar{
background:#13131a;
border:1px solid #26263a;
padding:15px;
border-radius:16px;
margin-bottom:20px;
}

.card{
background:#13131a;
border:1px solid #26263a;
border-radius:18px;
padding:18px;
margin-bottom:15px;
}

.title{
font-size:22px;
font-weight:bold;
color:#b78cff;
}

.badge{
background:#7d4dff;
padding:4px 8px;
border-radius:8px;
font-size:12px;
margin-left:8px;
}

.game{
margin-top:8px;
color:#8d8d99;
}

.owner{
margin-top:5px;
color:#777;
font-size:13px;
}

.buttons{
display:flex;
gap:10px;
margin-top:15px;
}

.buttons button{
flex:1;
padding:12px;
border:none;
border-radius:12px;
cursor:pointer;
font-weight:bold;
}

.copy{
background:#7d4dff;
color:white;
}

.favorite{
background:#ff4081;
color:white;
}

.report{
background:#26263a;
color:white;
}

.delete{
background:#ff3d5a;
color:white;
}

.footer{
margin-top:30px;
text-align:center;
color:#666;
}

</style>
</head>
<body>

<div class="topbar">

<div class="logo">
ScriptsRBLX
</div>

<div class="subtitle">
Modern Roblox Script Platform
</div>

<input
type="text"
class="search"
placeholder="Search scripts..."
id="search"
onkeyup="searchScripts()"
>

<div class="topButtons">

<button onclick="toggleAuth()">
Account
</button>

<button onclick="toggleUpload()">
Upload
</button>

<button onclick="showAllScripts()">
All
</button>

<button onclick="showFavorites()">
Favorites
</button>

</div>

</div>

<div class="userBar" id="userBar">
Logged out
</div>

<div class="authBox" id="authBox">

<input type="email" id="email" placeholder="Email">

<input type="password" id="password" placeholder="Password">

<button class="submitBtn" onclick="signup()">
Sign Up
</button>

<button class="submitBtn" onclick="login()">
Login
</button>

<button class="submitBtn" onclick="logout()">
Logout
</button>

</div>

<div class="uploadBox" id="uploadBox">

<input type="text" id="title" placeholder="Script Title">

<input type="text" id="game" placeholder="Game Name">

<select id="category">

<option>Universal</option>
<option>MM2</option>
<option>Blox Fruits</option>
<option>Arsenal</option>
<option>Admin</option>

</select>

<textarea rows="6" id="script" placeholder="Paste script here..."></textarea>

<input type="text" id="video" placeholder="Video URL">

<button class="submitBtn" onclick="submitScript()">
Upload Script
</button>

</div>

<div id="scripts"></div>

<div class="footer">
ScriptsRBLX © 2026
</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
getDatabase,
ref,
push,
onValue,
remove
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

const firebaseConfig = {

apiKey:"YOUR_API_KEY",
authDomain:"YOUR_AUTH_DOMAIN",
databaseURL:"YOUR_DATABASE_URL",
projectId:"YOUR_PROJECT_ID",
storageBucket:"YOUR_STORAGE_BUCKET",
messagingSenderId:"YOUR_SENDER_ID",
appId:"YOUR_APP_ID"

};

const app =
initializeApp(firebaseConfig);

const db =
getDatabase(app);

const auth =
getAuth(app);

const verifiedUsers = [

"kornc2008@gmail.com"

];

window.allScripts = [];

window.toggleAuth = function(){

const box =
document.getElementById("authBox");

box.style.display =
box.style.display === "block"
? "none"
: "block";

}

window.toggleUpload = function(){

const box =
document.getElementById("uploadBox");

box.style.display =
box.style.display === "block"
? "none"
: "block";

}

window.signup = async function(){

try{

await createUserWithEmailAndPassword(
auth,
email.value,
password.value
);

alert("Account created.");

}catch(err){

alert(err.message);

}

}

window.login = async function(){

try{

await signInWithEmailAndPassword(
auth,
email.value,
password.value
);

alert("Logged in.");

}catch(err){

alert(err.message);

}

}

window.logout = async function(){

await signOut(auth);

alert("Logged out.");

}

onAuthStateChanged(auth,(user)=>{

const userBar =
document.getElementById("userBar");

if(user){

userBar.innerHTML =
`Logged in as:<br><br>${user.email}`;

}else{

userBar.innerHTML =
`Logged out`;

}

});

window.submitScript = function(){

const user =
auth.currentUser;

if(!user){

alert("Login required.");

return;

}

push(ref(db,"scripts"),{

title:title.value,
game:game.value,
category:category.value,
script:script.value,
video:video.value,
owner:user.email

});

alert("Uploaded.");

}

onValue(ref(db,"scripts"),(snapshot)=>{

const data =
snapshot.val();

if(!data){

scripts.innerHTML =
`<div class="card">No scripts.</div>`;

return;

}

window.allScripts =
Object.entries(data).reverse();

renderScripts(window.allScripts);

});

function renderScripts(list){

scripts.innerHTML = "";

list.forEach(([key,scriptData])=>{

let badge = "";

if(
verifiedUsers.includes(scriptData.owner)
){
badge =
`<span class="badge">Verified</span>`;
}

let deleteButton = "";

if(
auth.currentUser &&
(
auth.currentUser.email === scriptData.owner ||
verifiedUsers.includes(auth.currentUser.email)
)
){

deleteButton = `
<button class="delete"
onclick="deleteScript('${key}')">
Delete
</button>
`;

}

scripts.innerHTML += `

<div class="card">

<div class="title">
${scriptData.title}
${badge}
</div>

<div class="game">
Game: ${scriptData.game}
</div>

<div class="game">
Category: ${scriptData.category}
</div>

<div class="owner">
Uploader: ${scriptData.owner}
</div>

<div class="buttons">

<button class="copy"
onclick='copyScript(${JSON.stringify(scriptData.script)})'>
Copy
</button>

<button class="favorite"
onclick='favoriteScript(${JSON.stringify(scriptData.title)})'>
Favorite
</button>

<button class="report"
onclick="reportScript()">
Report
</button>

${deleteButton}

</div>

</div>

`;

});

}

window.copyScript = function(script){

navigator.clipboard.writeText(script);

alert("Copied.");

}

window.favoriteScript = function(title){

let favorites =
JSON.parse(
localStorage.getItem("favorites")
) || [];

if(favorites.includes(title)){

alert("Already favorited.");

return;

}

favorites.push(title);

localStorage.setItem(
"favorites",
JSON.stringify(favorites)
);

alert("Favorited.");

}

window.showFavorites = function(){

const favorites =
JSON.parse(
localStorage.getItem("favorites")
) || [];

const filtered =
window.allScripts.filter(
([key,script])=>
favorites.includes(script.title)
);

renderScripts(filtered);

}

window.showAllScripts = function(){

renderScripts(window.allScripts);

}

window.reportScript = function(){

alert("Reported.");

}

window.deleteScript = async function(key){

const confirmDelete =
confirm("Delete script?");

if(!confirmDelete) return;

await remove(
ref(db,"scripts/" + key)
);

alert("Deleted.");

}

window.searchScripts = function(){

const value =
search.value.toLowerCase();

const cards =
document.querySelectorAll(".card");

cards.forEach(card=>{

if(
card.innerText.toLowerCase()
.includes(value)
){
card.style.display = "block";
}else{
card.style.display = "none";
}

});

}

</script>
</body>
</html>
