<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>ScriptsRBLX</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#0b0b0f;
color:white;
padding:20px;
}

.topbar{
background:#13131a;
border:1px solid #26263a;
padding:15px;
border-radius:16px;
margin-bottom:20px;
box-shadow:0 0 20px rgba(111,0,255,0.25);
}

.logo{
font-size:30px;
font-weight:bold;
color:#9d5cff;
}

.subtitle{
margin-top:5px;
color:#8d8d99;
}

.search{
width:100%;
margin-top:15px;
padding:12px;
border:none;
outline:none;
border-radius:12px;
background:#1b1b26;
color:white;
font-size:15px;
}

.topButtons{
display:flex;
gap:10px;
margin-top:15px;
}

.topButtons button{
flex:1;
padding:14px;
border:none;
border-radius:14px;
background:#7d4dff;
color:white;
font-weight:bold;
cursor:pointer;
}

.authBox,
.uploadBox{
display:none;
background:#13131a;
border:1px solid #26263a;
border-radius:18px;
padding:20px;
margin-bottom:20px;
}

.authBox input,
.uploadBox input,
.uploadBox textarea,
.uploadBox select{
width:100%;
margin-top:12px;
padding:12px;
border:none;
border-radius:12px;
background:#1b1b26;
color:white;
}

.uploadBox textarea{
resize:none;
}

.submitBtn{
width:100%;
margin-top:15px;
padding:14px;
border:none;
border-radius:14px;
background:#7d4dff;
color:white;
font-weight:bold;
cursor:pointer;
}

.userBar{
background:#13131a;
border:1px solid #26263a;
padding:15px;
border-radius:16px;
margin-bottom:20px;
display:none;
}

.scripts{
display:flex;
flex-direction:column;
gap:15px;
}

.card{
background:#13131a;
border:1px solid #26263a;
border-radius:18px;
padding:18px;
}

.title{
font-size:22px;
font-weight:bold;
color:#b78cff;
}

.badge{
background:#7d4dff;
padding:4px 8px;
border-radius:8px;
font-size:12px;
margin-left:8px;
}

.game{
margin-top:8px;
color:#8d8d99;
}

.owner{
margin-top:5px;
color:#777;
font-size:13px;
}

.desc{
margin-top:12px;
line-height:1.5;
}

.buttons{
display:flex;
gap:10px;
margin-top:15px;
}

.buttons button{
flex:1;
padding:12px;
border:none;
border-radius:12px;
cursor:pointer;
font-weight:bold;
}

.copy{
background:#7d4dff;
color:white;
}

.report{
background:#1f1f2e;
color:white;
border:1px solid #31314d;
}

.favorite{
background:#ff4081;
color:white;
}

.footer{
margin-top:30px;
text-align:center;
color:#666;
font-size:13px;
}

a{
color:#9d5cff;
text-decoration:none;
}

</style>

</head>
<body>

<div class="topbar">

<div class="logo">
ScriptsRBLX
</div>

<div class="subtitle">
Modern Roblox Script Hub
</div>

<input
type="text"
class="search"
placeholder="Search scripts..."
id="search"
onkeyup="searchScripts()"
>

<div class="topButtons">

<button onclick="toggleAuth()">
Account
</button>

<button onclick="toggleUpload()">
Upload
</button>

</div>

</div>

<div class="userBar"
id="userBar">
Logged out
</div>

<div class="authBox"
id="authBox">

<input
type="email"
id="email"
placeholder="Email">

<input
type="password"
id="password"
placeholder="Password">

<button
class="submitBtn"
onclick="signup()">
Sign Up
</button>

<button
class="submitBtn"
onclick="login()">
Login
</button>

<button
class="submitBtn"
onclick="logout()">
Logout
</button>

</div>

<div class="uploadBox"
id="uploadBox">

<input
type="text"
id="title"
placeholder="Script Title">

<input
type="text"
id="game"
placeholder="Game Name">

<select id="category">

<option>Universal</option>
<option>MM2</option>
<option>Blox Fruits</option>
<option>Arsenal</option>
<option>Admin</option>

</select>

<textarea
rows="6"
id="script"
placeholder="Paste script here..."></textarea>

<input
type="text"
id="video"
placeholder="Video Proof URL">

<button
class="submitBtn"
onclick="submitScript()">
Upload Script
</button>

</div>

<div class="scripts"
id="scripts">

</div>

<div class="footer">
ScriptsRBLX © 2026
</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
getDatabase,
ref,
push,
onValue
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

const firebaseConfig = {
apiKey: "AIzaSyB8lCF0DgtTG7sSL4WrlidiFDYWajdcJ8E",
authDomain: "moourbx.firebaseapp.com",
databaseURL: "https://moourbx-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId: "moourbx",
storageBucket: "moourbx.firebasestorage.app",
messagingSenderId: "798297032764",
appId: "1:798297032764:web:3f5902c25f88f6f3455b39"
};

const app =
initializeApp(firebaseConfig);

const db =
getDatabase(app);

const auth =
getAuth(app);

const verifiedUsers = [

"kornc2008@gmail.com"

];

window.toggleAuth = function(){

const box =
document.getElementById("authBox");

box.style.display =
box.style.display === "block"
? "none"
: "block";

}

window.toggleUpload = function(){

const box =
document.getElementById("uploadBox");

box.style.display =
box.style.display === "block"
? "none"
: "block";

}

window.signup = async function(){

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

try{

await createUserWithEmailAndPassword(
auth,
email,
password
);

alert("Account created.");

}catch(error){

alert(error.message);

}

}

window.login = async function(){

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

try{

await signInWithEmailAndPassword(
auth,
email,
password
);

alert("Logged in.");

}catch(error){

alert(error.message);

}

}

window.logout = async function(){

await signOut(auth);

alert("Logged out.");

}

onAuthStateChanged(auth,(user)=>{

const userBar =
document.getElementById("userBar");

if(user){

userBar.style.display = "block";

userBar.innerHTML = `
Logged in as:
<br><br>
${user.email}
`;

}else{

userBar.style.display = "block";

userBar.innerHTML = `
Logged out
`;

}

});

window.submitScript = function(){

const user =
auth.currentUser;

if(!user){

alert("Login required.");

return;

}

const title =
document.getElementById("title").value;

const game =
document.getElementById("game").value;

const category =
document.getElementById("category").value;

const script =
document.getElementById("script").value;

const video =
document.getElementById("video").value;

if(
title === "" ||
game === "" ||
script === "" ||
video === ""
){
alert("Fill everything.");
return;
}

push(ref(db,"scripts"),{

title,
game,
category,
script,
video,
owner:user.email,
favorites:0

});

alert("Script uploaded.");

}

const scriptsRef =
ref(db,"scripts");

onValue(scriptsRef,(snapshot)=>{

const container =
document.getElementById("scripts");

container.innerHTML = "";

const data =
snapshot.val();

if(!data){

container.innerHTML = `
<div class="card">
No scripts uploaded yet.
</div>
`;

return;

}

Object.values(data)
.reverse()
.forEach(scriptData=>{

let badge = "";

if(
verifiedUsers.includes(
scriptData.owner
)
){
badge = `
<span class="badge">
Verified
</span>
`;
}

const card =
document.createElement("div");

card.className = "card";

card.innerHTML = `

<div class="title">
${scriptData.title}
${badge}
</div>

<div class="game">
Game:
${scriptData.game}
</div>

<div class="game">
Category:
${scriptData.category}
</div>

<div class="owner">
Uploader:
${scriptData.owner}
</div>

<div class="desc">

<a href="${scriptData.video}"
target="_blank">
Open Video Proof
</a>

</div>

<div class="buttons">

<button class="copy"
onclick='copyScript(${JSON.stringify(scriptData.script)})'>
Copy
</button>

<button class="favorite"
onclick="favoriteScript()">
Favorite
</button>

<button class="report"
onclick="reportScript()">
Report
</button>

</div>

`;

container.appendChild(card);

});

});

window.copyScript = function(script){

navigator.clipboard.writeText(script);

alert("Script copied.");

}

window.favoriteScript = function(){

alert("Favorites system coming soon.");

}

window.reportScript = function(){

alert("Reported.");

}

window.searchScripts = function(){

const value =
document
.getElementById("search")
.value
.toLowerCase();

const cards =
document.querySelectorAll(".card");

cards.forEach(card=>{

if(
card.innerText
.toLowerCase()
.includes(value)
){
card.style.display = "block";
}else{
card.style.display = "none";
}

});

}

</script>

</body>
</html>
